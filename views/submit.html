<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submission Successful</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #38bdf8;
        --bg: #0f172a;
        --glass: rgba(30, 41, 59, 0.7);
        --text: #f8fafc;
      }

      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: var(--text);
        background-color: var(--bg);
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(56, 189, 248, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            rgba(99, 102, 241, 0.15) 0px,
            transparent 50%
          );
      }

      .card {
        background: var(--glass);
        backdrop-filter: blur(12px);
        padding: 3rem 2rem;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
        max-width: 450px;
        width: 90%;
        animation: slideUp 0.5s ease-out;
      }

      .icon-circle {
        width: 60px;
        height: 60px;
        background: rgba(16, 185, 129, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }

      .icon-circle svg {
        width: 30px;
        height: 30px;
        color: #34d399;
      }

      .data-display {
        background: rgba(15, 23, 42, 0.5);
        border-radius: 16px;
        padding: 20px;
        margin: 20px 0;
        text-align: left;
        border: 1px solid rgba(255, 255, 255, 0.05);

        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .data-item {
        font-size: 0.9rem;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .label {
        color: var(--primary);
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        display: block;
      }
      .value {
        color: #e2e8f0;
        word-break: break-all;
        line-height: 1.5;
      }

      .btn {
        display: block;
        background-color: var(--primary);
        color: #0f172a;
        padding: 14px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: all 0.2s;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .nameClass {
        color: #4ade80;
        font-weight: bold;
      }

      .error {
        color: #f87171b3;
        font-style: italic;
        font-weight: 600;
      }

      .btn-primary,
      .btn-secondary {
        padding: 14px 28px;
        border-radius: 12px;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-block;
      }

      .btn-primary {
        background: #38bdf8;
        color: #0f172a;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border: 1px solid var(--border);
      }

      @media (hover: hover) {
        .btn-primary:hover {
          background: rgb(21, 169, 238);
          transform: translateY(-2px);
          box-shadow: 0 0 24px -4px rgba(56, 189, 248, 0.5);
        }

        .btn-secondary:hover {
          background: rgba(255, 255, 255, 0.1);
          border-color: rgba(255, 255, 255, 0.2);
          transform: translateY(-2px);
        }
      }

      .btn-wrapper {
        display: flex;
        word-spacing: 1.5px;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-circle">
        <svg
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="3"
            d="M5 13l4 4L19 7"
          ></path>
        </svg>
      </div>

      <h1>Success!</h1>
      <p style="color: #94a3b8">Here is what you sent us:</p>

      <div class="data-display">
        <div class="data-item">
          <span class="label">Name</span>
          <span class="value {{nameClass}}">{{name}}</span>
        </div>
        <div class="data-item">
          <span class="label">Email</span>
          <span class="value {{emailClass}}">{{email}}</span>
        </div>
        <div class="data-item">
          <span class="label">Message</span>
          <span class="value {{messageClass}}">{{message}}</span>
        </div>
      </div>

      <div class="btn-wrapper">
        <a href="/projects/login" class="btn-primary">Try again</a>
        <a href="/" class="btn-secondary">Return Home</a>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create ID</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #05080f;
        --surface: rgba(10, 18, 35, 0.85);
        --border: rgba(99, 179, 237, 0.15);
        --border-focus: rgba(99, 179, 237, 0.6);
        --accent: #63b3ed;
        --accent-bright: #90cdf4;
        --accent-glow: rgba(99, 179, 237, 0.2);
        --indigo: #818cf8;
        --text: #e2e8f0;
        --muted: #64748b;
        --input-bg: rgba(5, 10, 20, 0.7);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", sans-serif;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* overflow: hidden; */
        position: relative;
        padding: 5rem 0;
        background-color: #0f172a;
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(56, 189, 248, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            rgba(99, 102, 241, 0.15) 0px,
            transparent 50%
          );
      }

      /* ── Background layers ── */
      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .bg-glow::before {
        content: "";
        position: absolute;
        width: 600px;
        height: 600px;
        top: -200px;
        left: -150px;
        background: radial-gradient(
          circle,
          rgba(99, 179, 237, 0.07) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }
      .bg-glow::after {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        bottom: -150px;
        right: -100px;
        background: radial-gradient(
          circle,
          rgba(129, 140, 248, 0.08) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }

      /* Dot grid texture */
      .bg-dots {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image: radial-gradient(
          rgba(99, 179, 237, 0.08) 1px,
          transparent 1px
        );
        background-size: 28px 28px;
        pointer-events: none;
      }

      /* ── Card ── */
      .card {
        position: relative;
        z-index: 1;
        /* background: var(--surface); */
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        border-radius: 20px;
        width: 90%;
        max-width: 420px;
        padding: 44px 40px 40px;
        box-shadow:
          0 0 0 1px rgba(99, 179, 237, 0.04),
          0 32px 64px -16px rgba(0, 0, 0, 0.7),
          0 0 80px -20px rgba(99, 179, 237, 0.06);
        animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* Accent top line */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          var(--indigo),
          transparent
        );
        border-radius: 99px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(28px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* ── Header ── */
      .card-header {
        margin-bottom: 32px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(99, 179, 237, 0.08);
        border: 1px solid rgba(99, 179, 237, 0.2);
        border-radius: 99px;
        padding: 4px 12px;
        font-size: 0.7rem;
        font-family: "DM Sans", monospace;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }

      .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--accent);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      h1 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.1;
        background: linear-gradient(
          135deg,
          #e2e8f0 30%,
          var(--accent) 80%,
          var(--indigo)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        margin-top: 8px;
        font-size: 0.875rem;
        color: var(--muted);
        font-weight: 400;
        line-height: 1.5;
      }

      /* ── Form ── */
      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
      }

      input,
      textarea {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }

      input::placeholder,
      textarea::placeholder {
        color: #334155;
      }

      input:focus,
      textarea:focus {
        border-color: var(--border-focus);
        background: rgba(5, 10, 20, 0.9);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      textarea {
        resize: vertical;
        min-height: 88px;
        max-height: 200px;
        line-height: 1.6;
      }

      /* ── Submit button ── */
      .btn-submit {
        margin-top: 8px;
        width: 100%;
        padding: 14px;
        background: linear-gradient(
          135deg,
          var(--accent) 0%,
          var(--indigo) 100%
        );
        color: #05080f;
        border: none;
        border-radius: 10px;
        font-family: "Syne", sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          filter 0.2s;
      }

      .btn-submit::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.15),
          transparent
        );
        border-radius: inherit;
      }

      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px -6px rgba(99, 179, 237, 0.45);
        filter: brightness(1.05);
      }

      .btn-submit:active {
        transform: translateY(0);
      }

      /* ── Divider ── */
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #1e293b;
        font-size: 0.75rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.06);
      }

      /* ── Footer link ── */
      .footer-link {
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .footer-link a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .footer-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="bg-dots"></div>

    <div class="card">
      <div class="card-header">
        <div class="badge">New Identity</div>
        <h1>Create Your ID</h1>
        <p class="subtitle">
          Fill in your details below to generate a personalized identity card.
        </p>
      </div>

      <form action="/projects/submit" method="POST">
        <div class="field">
          <label for="name">Full Name</label>
          <input
            id="name"
            type="text"
            name="name"
            placeholder="e.g. Alex Rivera"
            required
            autofocus
          />
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="you@example.com"
          />
        </div>

        <div class="field">
          <label for="imgLink">Avatar URL</label>
          <input
            id="imgLink"
            type="url"
            name="imgLink"
            placeholder="https://example.com/photo.jpg"
          />
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="3"
            placeholder="Say something..."
          ></textarea>
        </div>

        <button class="btn-submit" type="submit">Generate ID →</button>

        <div class="divider">or</div>

        <div class="footer-link">
          Already have one? <a href="/">Return home</a>
        </div>
      </form>
    </div>
  </body>
</html>
